services:
  - type: web
    name: civiclens-ai
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
