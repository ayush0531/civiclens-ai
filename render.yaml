services:
  - type: web
    name: civiclens-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
